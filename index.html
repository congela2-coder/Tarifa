:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171a; --panel:#1b2226; --fg:#e8eef0; --muted:#98a6ad; --line:#2b353b;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:4px 6px 4px 14px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:500 1.2rem var(--body);padding-block:10px}
.search input::placeholder{color:var(--muted);font-weight:400}
.clear{border:0;background:var(--chip);color:var(--fg);font:600 .9rem var(--body);border-radius:8px;padding:8px 12px;cursor:pointer}
.clear:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tip{font-size:.85rem;color:var(--muted);margin:0}
.tip b{color:var(--fg);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 .9rem var(--body);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
select{font:500 .9rem var(--body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 10px;max-width:100%;min-width:0;flex:1 1 160px}
.label{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--muted);margin:16px 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{min-width:0;font-weight:600;font-size:1.02rem;overflow-wrap:anywhere}
.meta{grid-column:1;font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg)}
.price{grid-row:1 / span 2;grid-column:2;text-align:right;align-self:center;font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{display:block;font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);margin-top:3px}
.price.hl{background:var(--offer);color:var(--offer-fg);padding:6px 8px;border-radius:6px}
.price.hl small{color:var(--offer-fg)}
.badge{background:var(--offer);color:var(--offer-fg);font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
mark{background:transparent;color:var(--accent);font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.more{display:block;width:100%;margin-top:10px}
</style>

const STOP=new Set('a al de del la las el los lo un una unos unas que cual cuanto cuanta esta estan es precio precios tiene tienes tenemos me dime por favor kilo kilos kg y o en e mira busca buscar sale'.split(' '));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const stem=t=>t.length>4&&t.endsWith('es')&&!t.endsWith('ies')?t.slice(0,-2):(t.length>3&&t.endsWith('s')?t.slice(0,-1):t);
const items=RAW.map(([c,d,u,p,o,f,s])=>{
  const dt=norm(d).split(' ').filter(Boolean);
  const exp=[];dt.forEach(t=>{exp.push(t);if(ABBR[t])exp.push(...ABBR[t].split(' '))});
  if(d.includes('S/'))exp.push('sin');if(d.includes('C/'))exp.push('con');
  return {c,d,u,p,o,f,s,dt:exp.map(stem),ft:norm(f+' '+s).split(' ').map(stem)};
});
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
const fams=[...new Set(items.map(i=>i.f))];
fams.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f.charAt(0)+f.slice(1).toLowerCase();$('fam').appendChild(o)});
$('count').textContent=items.length+' artículos';
const tokMatch=(q,t)=>t.startsWith(q)||(t.length>=3&&q.startsWith(t));
let limit=60;
function search(){
  const raw=$('q').value, qn=norm(raw);
  const onlyO=$('offers').getAttribute('aria-pressed')==='true', fam=$('fam').value;
  let pool=items.filter(i=>(!onlyO||i.o)&&(!fam||i.f===fam));
  let list, qt=[];
  if(!qn){list=pool}
  else if(/^\d{3,5}$/.test(qn)){list=pool.filter(i=>i.c.startsWith(qn))}
  else{
    qt=qn.split(' ').filter(t=>t&&!STOP.has(t)).map(stem);
    if(!qt.length){list=pool}
    else{
      const scored=[];
      for(const i of pool){
        let hit=0,sc=0;
        for(const q of qt){
          if(i.dt.some(t=>tokMatch(q,t))){hit++;sc+=3+(i.dt.some(t=>t===q)?1:0)}
          else if(i.ft.some(t=>tokMatch(q,t))){hit++;sc+=1}
        }
        if(hit)scored.push({i,full:hit===qt.length,sc,hit});
      }
      const full=scored.filter(x=>x.full);
      const use=full.length?full:scored.filter(x=>x.hit===Math.max(...scored.map(y=>y.hit)));
      use.sort((a,b)=>b.sc-a.sc||a.i.d.length-b.i.d.length);
      list=use.map(x=>x.i);
      $('lab').dataset.partial=full.length?'':'1';
    }
  }
  render(list,qt,raw.trim(),onlyO||fam);
}
function hl(d,qt){
  if(!qt.length)return esc(d);
  return d.split(/(\s+)/).map(w=>{const n=stem(norm(w).split(' ')[0]||'');return n&&qt.some(q=>tokMatch(q,n))?'<mark>'+esc(w)+'</mark>':esc(w)}).join('');
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(list,qt,raw,filtered){
  const lab=$('lab');
  if(!raw&&!filtered) lab.textContent='Toda la tarifa · '+list.length+' artículos';
  else if(!list.length) lab.textContent='Sin resultados';
  else lab.textContent=(lab.dataset.partial&&raw?'Parecidos a ':'')+(raw?'"'+raw+'"':'Filtrado')+' · '+list.length+(list.length===1?' artículo':' artículos');
  lab.dataset.partial='';
  if(!list.length){$('res').innerHTML='<div class="empty">No encuentro nada con esas palabras. Prueba con menos palabras o con el código del artículo.</div>';return}
  const shown=list.slice(0,limit);
  let h='<ul>'+shown.map(i=>`<li><div class="name">${hl(i.d,qt)}</div><div class="price${i.o?' hl':''}">${fmt(i.p)}<small>€/${i.u}</small></div><div class="meta"><span class="code">${i.c}</span><span>${esc(i.s||i.f)}</span>${i.o?'<span class="badge">Amarillo</span>':''}</div></li>`).join('')+'</ul>';
  if(list.length>limit)h+=`<button class="chip more" id="more" type="button">Ver ${Math.min(60,list.length-limit)} más de ${list.length-limit} restantes</button>`;
  $('res').innerHTML=h;
  const m=$('more');if(m)m.onclick=()=>{limit+=60;search()};
}
let tmr;
$('q').addEventListener('input',()=>{clearTimeout(tmr);limit=60;tmr=setTimeout(search,120)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur()}});
$('clear').onclick=()=>{$('q').value='';limit=60;search();$('q').focus()};
$('offers').onclick=()=>{const b=$('offers');b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');limit=60;search()};
$('fam').onchange=()=>{limit=60;search()};
search();
